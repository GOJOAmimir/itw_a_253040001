<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan2b</title>
  </head>

  <body>
    <table border="1" cellpadding="10" cellspacing="0" bordercolor="grey">
      <tr>
        <th colspan="3" bgcolor="gray">Input Data Mahasiswa</th>
      </tr>

      <tr>
        <td>Username</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <input type="text" name="Username" />
          </form>
        </td>
      </tr>

      <tr>
        <td>Password</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <input type="password" name="password" />
          </form>
        </td>
      </tr>

      <tr>
        <td>Fullname</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <input type="text" name="Fullname" />
          </form>
        </td>
      </tr>

      <tr>
        <td>Agama</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <select name="" id="">
              <option name="agama" selected>--Pilih Agama--</option>
              <option value="islam">Islam</option>
              <option value="kristen">Kristen</option>
              <option value="none">Tidak ada</option>
            </select>
          </form>
        </td>
      </tr>

      <tr>
        <td>Jenis Kelamin</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <input type="radio" name="pria" />Laki-laki
            <input type="radio" name="wanita" />Perempuan
          </form>
        </td>
      </tr>

      <tr>
        <td>Hobi</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <input type="checkbox" name="musik" />Musik
            <input type="checkbox" name="olahraga" />Olahraga
            <input type="checkbox" name="gaming" />Gaming
            <input type="checkbox" name="lainnya" />Lainnya
          </form>
        </td>
      </tr>

      <tr>
        <td>Profil Singkat</td>
        <td align="center">:</td>
        <td>
          <form action="">
            <textarea name="profil" id="" cols="40" rows="10"></textarea>
          </form>
        </td>
      </tr>

      <tr>
        <td colspan="3" align="right">
          <button>input</button>
        </td>
      </tr>
    </table>
  </body>
</html>
